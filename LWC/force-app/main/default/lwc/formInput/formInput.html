<template>
    <lightning-card title="주문">
        <div class="slds-p-around_small">
            <lightning-input
                name="customer"
                label="이름"
                required
                value={form.customer}
                onchange={handleChange}
            ></lightning-input>
            <lightning-input
                name="email"
                type="email"
                label="이메일"
                value={form.email}
                onchange={handleChange}
            ></lightning-input>

            <!-- 버튼 여러 개를 핸들러 하나로: data-* 속성 -->
            <div class="qty">
                <lightning-button label="-1" data-delta="-1" onclick={handleQuantity}></lightning-button>
                <span class="quantity">{form.quantity}</span>
                <lightning-button label="+1" data-delta="1" onclick={handleQuantity}></lightning-button>
            </div>

            <!-- 네이티브 input: 키를 누를 때마다 input 이벤트 -->
            <input class="memo" type="text" oninput={handleMemo} />
            <p class="memo-length">메모 {memoLength}자</p>

            <lightning-button class="submit" variant="brand" label="주문" onclick={handleSubmit}></lightning-button>
            <p class="result">{result}</p>
        </div>
    </lightning-card>
</template>
