<template>
    <!-- 1. lightning-record-form: 가장 간단. 필드 목록만 주면 보기/편집 화면을 만든다 -->
    <lightning-record-form
        class="quick-form"
        record-id={recordId}
        object-api-name={objectApiName}
        fields={quickFields}
        mode="view"
        columns="2"
    ></lightning-record-form>

    <!-- 2. lightning-record-edit-form: 배치와 저장 전 처리를 직접 제어 -->
    <lightning-record-edit-form
        class="edit-form"
        record-id={recordId}
        object-api-name={objectApiName}
        onsubmit={handleSubmit}
        onsuccess={handleSuccess}
        onerror={handleError}
    >
        <lightning-messages></lightning-messages>
        <lightning-input-field field-name={nameField}></lightning-input-field>
        <lightning-input-field field-name={industryField}></lightning-input-field>
        <lightning-input-field field-name={descriptionField}></lightning-input-field>
        <lightning-button type="submit" label="저장"></lightning-button>
    </lightning-record-edit-form>

    <!-- 3. lightning-record-view-form: 읽기 전용 배치 -->
    <lightning-record-view-form class="view-form" record-id={recordId} object-api-name={objectApiName}>
        <lightning-output-field field-name={nameField}></lightning-output-field>
    </lightning-record-view-form>

    <p class="message">{message}</p>
</template>
